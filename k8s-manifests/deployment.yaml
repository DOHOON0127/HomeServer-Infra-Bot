apiVersion: v1
kind: Namespace
metadata:
  name: infra-bot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-bot
  namespace: infra-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-bot
  template:
    metadata:
      labels:
        app: infra-bot
    spec:
      containers:
        - name: infra-bot
          image: ghcr.io/dohoon0127/homeserver-infra-bot:11818eb573916e966f4c64ce29c9ae43a29e1344
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: "http://10.0.0.1:9090"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infra-bot-secrets
                  key: telegram-bot-token
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: infra-bot-secrets
                  key: gemini-api-key
            - name: ALLOWED_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: infra-bot-secrets
                  key: allowed-chat-id
---
apiVersion: v1
kind: Service
metadata:
  name: infra-bot
  namespace: infra-bot
spec:
  selector:
    app: infra-bot
  ports:
    - port: 8000
      targetPort: 8000
