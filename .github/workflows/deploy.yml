name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s-manifests/**"   # CI가 만든 커밋이 다시 CI를 트리거하는 무한루프 방지

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 크로스빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/dohoon0127/homeserver-infra-bot:${{ github.sha }}

      - name: Update deployment manifest with new image tag
        run: |
          sed -i "s|image: ghcr.io/dohoon0127/homeserver-infra-bot:.*|image: ghcr.io/dohoon0127/homeserver-infra-bot:${{ github.sha }}|" k8s-manifests/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/deployment.yaml
          git commit -m "Deploy ${{ github.sha }}"
          git push
